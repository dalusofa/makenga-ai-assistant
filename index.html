<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makenga AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .tagline {
      margin-top: 8px;
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #64748b;
      line-height: 1.5;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .service {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      padding: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .service:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .service h3 {
      margin-bottom: 7px;
      font-size: 17px;
    }

    .service p {
      color: #64748b;
      font-size: 13px;
    }

    .chat {
      margin-top: 20px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .messages {
      min-height: 120px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .ai {
      background: #eef4ff;
    }

    .user {
      background: #e8f7ee;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }
